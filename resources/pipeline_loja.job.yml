resources:
  jobs:
    pipeline_loja:
      name: lab-cdc-pipeline-loja
      description: Lê a landing (Auto Loader) para a bronze e aplica o MERGE na silver.

      # Roda sozinho quando chegam arquivos novos na landing.
      trigger:
        pause_status: ${var.gatilho}  # PAUSED no dev, UNPAUSED no prd
        file_arrival:
          url: /Volumes/${var.catalogo}/bronze/landing/loja/
          min_time_between_triggers_seconds: 60  # no máximo 1 disparo por minuto
          wait_after_last_change_seconds: 60     # espera o lote terminar de chegar

      max_concurrent_runs: 1  # duas execuções ao mesmo tempo disputariam o mesmo checkpoint
      timeout_seconds: 1800   # job travado é pior que job que falha: falha avisa

      # Parâmetro do job: chega aos notebooks como o widget "catalogo".
      parameters:
        - name: catalogo
          default: ${var.catalogo}

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../databricks/01_bronze.py
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze  # a silver só roda se a bronze terminou com sucesso
          notebook_task:
            notebook_path: ../databricks/02_silver.py
          max_retries: 1
          min_retry_interval_millis: 60000

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
