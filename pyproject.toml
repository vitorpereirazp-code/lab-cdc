[project]
name = "lab-cdc"
version = "0.1.0"
description = "Laboratório de CDC em casa: origem transacional, captura por log, landing e bronze/silver."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_cdc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa de um Postgres ligado (defina LAB_CDC_INTEGRACAO=1)"]

[tool.ruff]
extend-exclude = ["databricks"]  # notebooks usam spark/dbutils globais do Databricks

line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
